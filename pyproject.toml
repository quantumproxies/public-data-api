[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-public-data-api"
version = "0.1.0"
description = "Public data API for Python and the command line: arXiv and OpenAlex papers, clinical trials, openFDA adverse events, World Bank indicators, weather, Wikipedia, Wikidata, Open Library books and NVD CVEs in one client, with one sign-in and the same JSON or CSV rows. Free and open source; runs on your QuanticData account."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["public-data-api", "public-apis", "open-data", "open-data-api", "arxiv-api", "arxiv", "openalex", "research-papers", "academic-papers", "clinical-trials", "openfda", "world-bank-api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
public-data = "quanticdata_public_data_api.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/arxiv-api/?utm_source=github&utm_medium=pypi&utm_campaign=public-data-api"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/public-data-api"
Issues = "https://github.com/quantumproxies/public-data-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_public_data_api" = ["spec.json", "py.typed"]
